# -- Theme Parameters --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme           = "congo"
defaultAppearance     = "light"
autoSwitchAppearance  = true

enableA11y                   = false   # [ADD] テーマ新既定に合わせ明示化
enableSearch                 = true
enableCodeCopy               = true
enableStructuredBreadcrumbs  = false   # [ADD] 構造化パンくずデータ(未使用のためfalse明示)

# mainSections = ["section1", "section2"]
# robots = ""

disableImageOptimization    = false
disableImageOptimizationMD  = false    # [ADD] Markdown内画像の最適化無効化フラグ(テーマ新規)
disableTextInHeader         = false

# defaultBackgroundImage = "IMAGE.jpg"
# defaultFeaturedImage   = "IMAGE.jpg"

fingerprintAlgorithm = "sha512"        # [ADD] SRIハッシュアルゴリズム明示(既定値と同じだが明示推奨)

smartTOC                      = true
smartTOCHideUnfocusedChildren = true

giteaDefaultServer   = "https://git.fsfe.org"        # [ADD] sharingLinksでgitea使用時の既定サーバ
forgejoDefaultServer = "https://v11.next.forgejo.org" # [ADD] 同上forgejo版

# -------------------------
# Language Redirect          [ADD] 多言語サイト用クライアント側リダイレクト
# -------------------------
[languageRedirect]
  enabled = false
  storageKey = "blowfish_preferred_language"
  browserRedirectHomeOnly = true
  storedLanguageRedirect = true

# -------------------------
# SEO                        [ADD]
# -------------------------
[seo]
# metaDescriptionOrder = ["summary", "description", "site"]

# -------------------------
# Header
# -------------------------
[header]
  layout = "fixed-gradient"

# -------------------------
# Footer
# -------------------------
[footer]
  showMenu              = true
  showCopyright         = true
  showThemeAttribution  = true
  showAppearanceSwitcher = true
  showScrollToTop       = true

# -------------------------
# Homepage
# -------------------------
[homepage]
  layout              = "custom"
  showRecent          = true
  showRecentItems     = 6
  showMoreLink        = true
  showMoreLinkDest    = "/post"
  cardView            = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = false

# -------------------------
# Article
# -------------------------
[article]
  showDate                = true
  showViews               = false
  showLikes               = false
  showDateOnlyInArticle   = false
  showDateUpdated         = false
  showAuthor              = true
  showAuthorBottom        = true
  showHero                = true
  heroStyle               = "basic"
  layoutBackgroundBlur    = true
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs         = true
  showDraftLabel          = true
  showEdit                = false
  editAppendPath          = true
  seriesOpened            = false
  showHeadingAnchors      = true
  showPagination          = true
  invertPagination        = false
  showReadingTime         = true
  showTableOfContents     = true
  showRelatedContent      = true
  relatedContentLimit     = 3
  showTaxonomies          = true
  showAuthorsBadges       = false
  showWordCount           = true
  showZenMode             = false
  showComments            = true
  externalLinkForceNewTab = true   # [ADD] 外部リンクを新規タブで開く(既定true、明示化)
  # sharingLinks = ["linkedin", "x-twitter", "reddit", "facebook", "email", "whatsapp", "telegram", "line"]  # [ADD候補] "line"追加可(日本語読者向け)

# -------------------------
# List
# -------------------------
[list]
  showHero                  = true
  heroStyle                 = "background"
  layoutBackgroundBlur      = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs           = false
  showSummary               = true
  showViews                 = false
  showLikes                 = false
  showTableOfContents       = false
  showCards                 = true
  groupByYear               = true
  cardView                  = true
  cardViewScreenWidth       = false
  constrainItemsWidth       = true

# -------------------------
# Sitemap
# -------------------------
[sitemap]
  excludedKinds = ["taxonomy", "term"]

# -------------------------
# Taxonomy
# -------------------------
[taxonomy]
  showTermCount         = true
  showHero              = false
  showBreadcrumbs       = false
  showViews             = false
  showLikes             = false
  showTableOfContents   = false
  cardView              = false

# -------------------------
# Term
# -------------------------
[term]
  showHero              = false
  heroStyle             = "background"
  showBreadcrumbs       = false
  showViews             = false
  showLikes             = false
  showTableOfContents   = true
  groupByYear           = false
  cardView              = false
  cardViewScreenWidth   = false

[firebase]
  # apiKey = "XXXXXX"
  # ...

[fathomAnalytics]
[umamiAnalytics]
[selineAnalytics]

[buymeacoffee]

